<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사과 게임 - 심플 에디션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@900&display=swap');

        :root {
            --apple-red: #ff8a8a;      
            --apple-dark: #ef5350;     
            --selected-yellow: #fff176; 
            --bg-green: #f1f8e9;       
        }

        body {
            touch-action: none;
            user-select: none;
            background-color: #f7f9fc; 
            font-family: 'Pretendard', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 850px;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        .btn-primary {
            background-color: var(--apple-dark);
            color: white;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 900;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #c62828;
        }

        .btn-primary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c62828;
        }

        #header-box {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 15px;
        }

        .value {
            font-size: 24px;
            font-weight: 900;
            color: var(--apple-dark);
            line-height: 1;
        }

        #game-wrapper {
            position: relative;
            background-color: var(--bg-green);
            background-image: 
                linear-gradient(white 1px, transparent 1px),
                linear-gradient(90deg, white 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            border: 4px solid #fff;
            width: fit-content;
        }

        #game-container {
            display: grid;
            grid-template-columns: repeat(17, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 10px;
        }

        .apple {
            width: 32px;
            height: 32px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .apple-inner {
            width: 100%;
            height: 100%;
            background-color: var(--apple-red);
            border-radius: 50% 50% 48% 48%; 
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 2px 0 var(--apple-dark);
            transition: transform 0.1s ease;
        }

        .apple-inner::before {
            content: '';
            position: absolute;
            top: -4px;
            width: 2px;
            height: 6px;
            background: #8d6e63; 
            border-radius: 1px;
            left: 50%;
            transform: translateX(-50%);
        }

        .apple-number {
            color: white; 
            font-size: 16px;
            font-weight: 900;
            z-index: 2;
            pointer-events: none;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }

        .apple.selected .apple-inner {
            background-color: var(--selected-yellow);
            box-shadow: 0 2px 0 #fbc02d;
            transform: scale(1.15);
        }

        .apple.selected .apple-number {
            color: #5d4037; 
            text-shadow: none;
        }

        .apple.removed {
            visibility: hidden;
            pointer-events: none;
        }

        #selection-box {
            position: absolute;
            border: 2px solid #81d4fa; 
            background-color: rgba(129, 212, 250, 0.2);
            pointer-events: none;
            display: none;
            z-index: 100;
            border-radius: 4px;
        }

        .apple.flying {
            position: fixed;
            z-index: 500;
            pointer-events: none;
            transition: all 0.5s ease-in;
            transform: scale(0.2);
            opacity: 0.5;
        }

        @media (max-width: 800px) {
            .apple { width: 28px; height: 28px; }
            .apple-number { font-size: 14px; }
            #game-container { gap: 6px; }
        }

        @media (max-width: 600px) {
            .apple { width: 18px; height: 18px; }
            .apple-number { font-size: 9px; }
            #game-container { gap: 3px; }
            #header-box { padding: 8px 15px; }
        }
    </style>
</head>
<body>

    <!-- 게임 화면 (기본 활성화) -->
    <div id="game-screen" class="screen active">
        <div id="header-box">
            <div class="flex flex-col items-center">
                <span class="text-[10px] font-bold text-gray-300 uppercase">Score</span>
                <span id="score-display" class="value">0</span>
            </div>
            <div class="text-center">
                <h1 class="text-sm font-black text-gray-400 tracking-tight">🍎 APPLE GAME</h1>
                <p id="timer-display" class="text-xl font-mono font-bold text-gray-700">02:00</p>
            </div>
            <div class="flex gap-2">
                <button id="restart-btn" class="bg-gray-100 text-gray-400 px-3 py-2 rounded-xl font-bold text-xs hover:bg-gray-200">RESET</button>
            </div>
        </div>

        <div id="game-wrapper">
            <div id="game-container"></div>
            <div id="selection-box"></div>
        </div>
    </div>

    <!-- 게임 오버 모달 -->
    <div id="game-over" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[1000] hidden">
        <div class="bg-white p-10 rounded-[30px] text-center max-w-sm w-full mx-4 shadow-2xl border-4 border-gray-50">
            <h2 class="text-2xl font-black text-gray-800 uppercase">Time Up!</h2>
            <div class="text-6xl font-black text-red-300 my-6" id="final-score">0</div>
            <div class="flex flex-col gap-3">
                <button id="modal-restart-btn" class="w-full btn-primary text-xl">다시 하기</button>
            </div>
        </div>
    </div>

    <script>
        // Game State
        const COLS = 17;
        const ROWS = 10;
        let score = 0;
        let timeLeft = 120;
        let isDragging = false;
        let startPos = { x: 0, y: 0 };
        let timerInterval = null;
        let apples = [];
        let isGameOver = false;

        const container = document.getElementById('game-container');
        const selectionBox = document.getElementById('selection-box');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const gameWrapper = document.getElementById('game-wrapper');

        function initGame() {
            clearInterval(timerInterval);
            container.innerHTML = '';
            apples = [];
            score = 0;
            timeLeft = 120;
            isGameOver = false;
            scoreDisplay.innerText = '0';
            updateTimer();
            document.getElementById('game-over').classList.add('hidden');

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const val = Math.floor(Math.random() * 9) + 1;
                    const appleEl = document.createElement('div');
                    appleEl.className = 'apple';
                    const inner = document.createElement('div');
                    inner.className = 'apple-inner';
                    const num = document.createElement('span');
                    num.className = 'apple-number';
                    num.innerText = val;
                    inner.appendChild(num);
                    appleEl.appendChild(inner);
                    container.appendChild(appleEl);
                    apples.push({ el: appleEl, value: val, removed: false, rect: null });
                }
            }
            setTimeout(cacheApplePositions, 300); 
            startTimer();
        }

        function cacheApplePositions() {
            const wrapperRect = gameWrapper.getBoundingClientRect();
            apples.forEach(apple => {
                const r = apple.el.getBoundingClientRect();
                apple.rect = {
                    left: r.left - wrapperRect.left,
                    top: r.top - wrapperRect.top,
                    right: r.right - wrapperRect.left,
                    bottom: r.bottom - wrapperRect.top
                };
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimer();
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function updateTimer() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerDisplay.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function endGame() {
            clearInterval(timerInterval);
            isGameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').classList.remove('hidden');
        }

        // 버튼 리스너
        document.getElementById('restart-btn').addEventListener('click', initGame);
        document.getElementById('modal-restart-btn').addEventListener('click', initGame);

        // 드래그 조작 로직
        function handleStart(e) {
            if (isGameOver) return;
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = gameWrapper.getBoundingClientRect();
            startPos = { x: clientX - rect.left, y: clientY - rect.top };
            selectionBox.style.display = 'block';
            selectionBox.style.width = '0px';
            selectionBox.style.height = '0px';
            selectionBox.style.left = startPos.x + 'px';
            selectionBox.style.top = startPos.y + 'px';
        }

        function handleMove(e) {
            if (!isDragging || isGameOver) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = gameWrapper.getBoundingClientRect();
            const curX = Math.max(0, Math.min(rect.width, clientX - rect.left));
            const curY = Math.max(0, Math.min(rect.height, clientY - rect.top));
            const l = Math.min(startPos.x, curX);
            const t = Math.min(startPos.y, curY);
            const w = Math.abs(startPos.x - curX);
            const h = Math.abs(startPos.y - curY);
            selectionBox.style.left = l + 'px';
            selectionBox.style.top = t + 'px';
            selectionBox.style.width = w + 'px';
            selectionBox.style.height = h + 'px';
            const box = { left: l, top: t, right: l + w, bottom: t + h };
            apples.forEach(apple => {
                if (apple.removed || !apple.rect) return;
                const isInside = !(apple.rect.right < box.left || apple.rect.left > box.right || apple.rect.bottom < box.top || apple.rect.top > box.bottom);
                apple.el.classList.toggle('selected', isInside);
            });
        }

        function handleEnd() {
            if (!isDragging || isGameOver) return;
            isDragging = false;
            selectionBox.style.display = 'none';
            const selected = apples.filter(a => !a.removed && a.el.classList.contains('selected'));
            if (selected.length === 0) return;
            const sum = selected.reduce((acc, curr) => acc + curr.value, 0);
            if (sum === 10) {
                const targetRect = scoreDisplay.getBoundingClientRect();
                selected.forEach(apple => {
                    const rect = apple.el.getBoundingClientRect();
                    const clone = apple.el.cloneNode(true);
                    clone.classList.add('flying');
                    clone.style.left = rect.left + 'px';
                    clone.style.top = rect.top + 'px';
                    clone.style.width = rect.width + 'px';
                    clone.style.height = rect.height + 'px';
                    document.body.appendChild(clone);
                    requestAnimationFrame(() => {
                        clone.style.left = targetRect.left + 'px';
                        clone.style.top = targetRect.top + 'px';
                    });
                    setTimeout(() => clone.remove(), 500);
                    apple.removed = true;
                    apple.el.classList.add('removed');
                });
                score += selected.length;
                scoreDisplay.innerText = score;
            } else {
                selected.forEach(apple => apple.el.classList.remove('selected'));
            }
        }

        gameWrapper.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        gameWrapper.addEventListener('touchstart', (e) => { 
            if (e.target.closest('#game-wrapper')) {
                e.preventDefault(); 
                handleStart(e); 
            }
        }, { passive: false });
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('resize', cacheApplePositions);

        // 페이지 로드 시 즉시 실행
        window.onload = initGame;
    </script>
</body>
</html>
